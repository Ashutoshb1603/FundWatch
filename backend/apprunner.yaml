version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  # Secrets (GROQ_API_KEY) are set in the App Runner console, not in this file.
  env:
    - name: LLM_PROVIDER
      value: groq
    - name: GROQ_MODEL
      value: openai/gpt-oss-120b
